name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/new-session-9tda09, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du moteur de calcul
        working-directory: app-finance-cgp
        run: npm test

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparation du site (racine du dépôt, sans le simulateur Python ni les tests)
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r app-finance-cgp _site/
          rm -rf _site/app-finance-cgp/tests _site/app-finance-cgp/vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
